<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таймер спавна РБ (LU4)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 16px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
h1 { font-size: 1.25rem; color: #38bdf8; }
input#searchInput { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f1f5f9; flex: 1; min-width: 200px; }
button { padding: 8px 14px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f1f5f9; cursor: pointer; font-size: 0.9rem; }
button:hover { background: #334155; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.sync { background: #0ea5e9; border-color: #0ea5e9; }
button.sync:hover { background: #38bdf8; }
table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #334155; }
th { background: #0f172a; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
tr:last-child td { border-bottom: none; }
tr:hover { background: #253045; }
.name { font-weight: 600; color: #f1f5f9; }
.respawn { color: #94a3b8; font-size: 0.85rem; }
.death { color: #94a3b8; font-family: monospace; font-size: 0.85rem; }
.timer { font-family: monospace; font-weight: 700; font-size: 0.9rem; }
.timer.waiting { color: #fbbf24; }
.timer.window { color: #22d3ee; }
.timer.spawned { color: #ef4444; }
.timer.unknown { color: #64748b; }
.actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn-kill { background: #dc2626; border-color: #dc2626; color: #fff; font-weight: 600; }
.btn-kill:hover:not(:disabled) { background: #ef4444; }
.btn-kill.disabled-state { background: #64748b; border-color: #64748b; }
.time-input { width: 30px; text-align: center; background: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-radius: 4px; padding: 4px 2px; font-size: 0.85rem; }
.time-sep { color: #94a3b8; margin: 0 2px; user-select: none; }
.btn-ok { background: #16a34a; border-color: #16a34a; color: #fff; }
.btn-ok:hover:not(:disabled) { background: #22c55e; }
</style>
</head>
<body>
<header>
<h1>Таймер спавна РБ (LU4)</h1>
<input type="text" id="searchInput" placeholder="🔍 Поиск босса по названию...">
<button class="sync" id="btnSync">🔄 Синхронизировать с облаком</button>
</header>
<table>
<thead>
<tr>
<th>Имя РБ</th>
<th>Респ (мин–макс)</th>
<th>Время смерти</th>
<th>Таймер / Статус</th>
<th>Действия</th>
</tr>
</thead>
<tbody id="bossTableBody"></tbody>
</table>
<script>
const tableBody = document.getElementById("bossTableBody");
const searchInput = document.getElementById("searchInput");
let bosses = [];

async function fetchBosses() {
  const res = await fetch("/api/bosses");
  bosses = await res.json();
  render();
}

async function syncBosses() {
  const btn = document.getElementById("btnSync");
  btn.disabled = true;
  btn.textContent = "⏳ Синхронизация...";
  try {
    const res = await fetch("/api/sync", { method: "POST" });
    bosses = await res.json();
    render();
  } finally {
    btn.disabled = false;
    btn.textContent = "🔄 Синхронизировать с облаком";
  }
}

async function killBoss(bossId, deathTime = null) {
  const btn = document.getElementById("btnKill-" + bossId);
  const hoursInput = document.getElementById("hours-" + bossId);
  const minutesInput = document.getElementById("minutes-" + bossId);
  const btnOk = document.getElementById("btnOk-" + bossId);
  const setDisabled = (els) => els.forEach(e => { e.disabled = true; e.classList.add("disabled-state"); });
  const setEnabled = (els) => els.forEach(e => { e.disabled = false; e.classList.remove("disabled-state"); });

  const payload = deathTime ? { death_time: deathTime } : {};
  try {
    const res = await fetch("/api/bosses/" + bossId + "/kill", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    bosses = await res.json();
    render();
  } finally {
    if (btn) {
      btn.textContent = "Ждите 3с...";
      setDisabled([btn, hoursInput, minutesInput, btnOk]);
      setTimeout(() => {
        btn.textContent = "⚔️ УБИТ";
        setEnabled([btn, hoursInput, minutesInput, btnOk]);
      }, 3000);
    }
  }
}

function formatLocalTime(unixTs) {
  if (!unixTs) return "—";
  return new Date(unixTs * 1000).toLocaleTimeString("ru-RU", { hour12: false });
}

function formatRemaining(seconds) {
  if (seconds <= 0) return "00:00:00";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function getTimer(boss) {
  const death = boss.death_time;
  if (!death) return { text: "Ожидание данных", cls: "unknown" };
  const now = Date.now() / 1000;
  const minSec = boss.respawn_min * 60;
  const maxSec = boss.respawn_max * 60;
  const windowStart = death + minSec;
  const windowEnd = death + maxSec;
  if (now < windowStart) {
    return { text: "До респа: " + formatRemaining(windowStart - now), cls: "waiting" };
  } else if (now < windowEnd) {
    return { text: "🟡 РЕСП ПОШЕЛ! До 100%: " + formatRemaining(windowEnd - now), cls: "window" };
  } else {
    return { text: "🔴 СТОИТ!", cls: "spawned" };
  }
}

function getTimerInfo(boss, now) {
  const death = boss.death_time;
  if (!death) return { priority: 3, remaining: 0, sinceSpawned: 0 };
  const minSec = boss.respawn_min * 60;
  const maxSec = boss.respawn_max * 60;
  const windowStart = death + minSec;
  const windowEnd = death + maxSec;
  if (now >= windowEnd) return { priority: 1, remaining: 0, sinceSpawned: now - windowEnd };
  if (now >= windowStart) return { priority: 0, remaining: windowEnd - now, sinceSpawned: 0 };
  return { priority: 2, remaining: windowStart - now, sinceSpawned: 0 };
}

function sortBosses(list) {
  const now = Date.now() / 1000;
  return list.slice().sort((a, b) => {
    if (a.name === "TESTER_RB") return 1;
    if (b.name === "TESTER_RB") return -1;
    const ta = getTimerInfo(a, now);
    const tb = getTimerInfo(b, now);
    if (ta.priority !== tb.priority) return ta.priority - tb.priority;
    if (ta.priority === 0) return ta.remaining - tb.remaining;
    if (ta.priority === 1) return ta.sinceSpawned - tb.sinceSpawned;
    if (ta.priority === 2) return ta.remaining - tb.remaining;
    return a.name.localeCompare(b.name);
  });
}

function parseBossTime(value) {
  const s = value.replace(":", "").trim();
  if (!/^\d{1,4}$/.test(s)) return null;
  const padded = s.padStart(4, "0");
  const h = parseInt(padded.slice(0, 2), 10);
  const m = parseInt(padded.slice(2, 4), 10);
  if (h > 23 || m > 59) return null;
  const now = Date.now() / 1000;
  const d = new Date();
  d.setHours(h, m, 0, 0);
  let ts = d.getTime() / 1000;
  if (ts - now > 3600) ts -= 86400;
  return ts;
}

function setBossKillTime(bossId) {
  const hEl = document.getElementById("hours-" + bossId);
  const mEl = document.getElementById("minutes-" + bossId);
  const h = parseInt(hEl.value, 10);
  const m = parseInt(mEl.value, 10);
  if (isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return;
  const now = Date.now() / 1000;
  const d = new Date();
  d.setHours(h, m, 0, 0);
  let ts = d.getTime() / 1000;
  if (ts - now > 3600) ts -= 86400;
  killBoss(bossId, ts);
  hEl.value = "";
  mEl.value = "";
}

function updateTimers() {
  bosses.forEach(function (b) {
    var el = document.getElementById("timer-" + b.id);
    if (!el) return;
    var timer = getTimer(b);
    el.textContent = timer.text;
    el.className = "timer " + timer.cls;
  });
}

function render() {
  var active = document.activeElement;
  if (active && active.tagName === "INPUT" && tableBody.contains(active)) return;
  const q = searchInput.value.toLowerCase();
  const filtered = bosses.filter(b => b.name.toLowerCase().includes(q));
  const sorted = sortBosses(filtered);
  tableBody.innerHTML = "";
  sorted.forEach(b => {
    const timer = getTimer(b);
    const row = document.createElement("tr");
    row.innerHTML = '<td><span class="name">' + b.name + '</span></td>' +
      '<td><span class="respawn">' + (b.name === "TESTER_RB" ? "10\u201320 сек" : b.respawn_min < 1 ? Math.round(b.respawn_min * 60) + '\u2013' + Math.round(b.respawn_max * 60) + ' сек' : b.respawn_min + '\u2013' + b.respawn_max + ' мин') + '</span></td>' +
      '<td><span class="death">' + formatLocalTime(b.death_time) + '</span></td>' +
      '<td><span id="timer-' + b.id + '" class="timer ' + timer.cls + '">' + timer.text + '</span></td>' +
      '<td><div class="actions">' +
      '<button class="btn-kill" id="btnKill-' + b.id + '" onclick="killBoss(' + b.id + ')">\u2694\ufe0f УБИТ</button>' +
      '<input type="text" id="hours-' + b.id + '" class="time-input" placeholder="ЧЧ" maxlength="2" oninput="if(this.value.length>=2){var m=document.getElementById(\'minutes-\'+'+b.id+');if(m)m.focus();}">' +
      '<span class="time-sep">:</span>' +
      '<input type="text" id="minutes-' + b.id + '" class="time-input" placeholder="ММ" maxlength="2">' +
      '<button class="btn-ok" id="btnOk-' + b.id + '" onclick="setBossKillTime(' + b.id + ')">ОК</button>' +
      '</div></td>';
    tableBody.appendChild(row);
  });
}

searchInput.addEventListener("input", render);
document.getElementById("btnSync").addEventListener("click", syncBosses);
fetchBosses();
setInterval(fetchBosses, 10000);
setInterval(updateTimers, 1000);
</script>
</body>
</html>
